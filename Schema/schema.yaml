    -
      family: "exchange_online"
      display_name: "Exchange Online"
      host: "outlook.office365.com"
      unique_endpoints: 0
apis:
  microsoft_graph:
    host: "graph.microsoft.com"
    endpoints:
      - "https://graph.microsoft.com/v1.0/users"
    resources:
      - "users"
  azure_ad_graph:
    host: "graph.windows.net"
    endpoints:
      - "https://graph.windows.net/{tenantId}/users?&api-version=1.6"
    resources:
      - "users"
  azure_resource_manager:
    host: "management.azure.com"
    endpoints: []
    resources: []
  microsoft_identity:
    host: "login.microsoftonline.com"
    endpoints:
      - "https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token"
    resources:
      - "{tenantId}"
  microsoft_teams:
    host: "teams.microsoft.com"
    endpoints:
      - "https://teams.microsoft.com/api/mt/emea/beta/users/tenants"
    resources:
      - "api"
  sharepoint_online:
    host: "sharepoint.com"
    endpoints: []
    resources: []
  exchange_online:
    host: "outlook.office365.com"
    endpoints: []
    resources: []
  other_apis:
    -
      host: "example.com"
      endpoints:
        - "https://example.com/api/v2/search"
      resources:
        - "v2"
