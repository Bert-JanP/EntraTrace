version: "1.0"
tool:
  name: "string"
  repository_url: "https://github.com/org/repo"
last_checked_utc: "YYYY-MM-DDTHH:MM:SSZ"
last_update_utc: "YYYY-MM-DDTHH:MM:SSZ"
user_agents:
  - "Mozilla/5.0 (...)"
summary:
  total_unique_endpoints: 0
  total_endpoint_mentions: 0
  files_scanned: 0
  api_families:
