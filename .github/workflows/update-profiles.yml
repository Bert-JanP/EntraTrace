name: Update tool profiles

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tool-profiles
  cancel-in-progress: false

jobs:
  update-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Update profiles
        shell: bash
        run: |
          while IFS= read -r repo || [[ -n "$repo" ]]; do
            repo="${repo%$'\r'}"
            [[ -z "$repo" || "$repo" == \#* ]] && continue
            python Scripts/ExtractToolBehavior.py \
              --repo "$repo" \
              --output-dir Profiles
          done < Profiles/Tools.txt

      - name: Update user-agent indicators
        run: python Scripts/SummarizeUserAgents.py

      - name: Commit generated updates
        shell: bash
        run: |
          git add Profiles "Indicator Lists/UserAgents.csv"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tool behavior profiles"
          git push